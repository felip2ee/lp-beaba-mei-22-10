version: "3.8"

services:
  lp-beaba-mei:
    image: ghcr.io/felip2ee/lp-beaba-mei-22-10:latest
    networks:
      - RainhaNet
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=RainhaNet

        # HTTPS
        - traefik.http.routers.lp-beaba-mei.rule=Host(`mei.elianearainhadocredito.com`)
        - traefik.http.routers.lp-beaba-mei.entrypoints=websecure
        - traefik.http.routers.lp-beaba-mei.tls.certresolver=letsencryptresolver
        - traefik.http.routers.lp-beaba-mei.priority=1
        - traefik.http.routers.lp-beaba-mei.service=lp-beaba-mei
        - traefik.http.services.lp-beaba-mei.loadbalancer.server.port=80
        - traefik.http.services.lp-beaba-mei.loadbalancer.passHostHeader=true

networks:
  RainhaNet:
    external: true
    name: RainhaNet
